# Railway / Nixpacks build configuration for this Laravel + Vite portfolio.
# Docs: https://nixpacks.com/docs/configuration/file

[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "nodejs_20"]

[phases.install]
cmds = ["composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader"]

[phases.build]
cmds = [
  "npm ci --include=dev",
  "npm run build",
  "php artisan view:cache",
]
